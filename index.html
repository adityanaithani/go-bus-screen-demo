<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GO Bus Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="papaparse.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div id="screen-container">
        <div id="title-bar">
          <div id="route-colour"></div>
          <div id="route-short-name"></div>
          <div id="route-long-name"></div>
          <div id="go-logo"></div>
          <div id="clock"></div>
        </div>
        <div id="info-bar">
          <div id="stop-request-alert"></div>
        </div>
        <div id="main-content">
          <div id="stops">
            <div id="next-stop-indicator"></div>
            <div id="stop-1"></div>
            <div id="stop-2"></div>
            <div id="stop-3"></div>
            <div id="stop-4"></div>
            <div id="stop-5"></div>
          </div>
          <div id="separators"></div>
        </div>
        <div id="announcements-bar">
          <div id="scrolling-announcements"></div>
        </div>
      </div>
    </main>
  </body>
</html>
